# ── Render production profile ─────────────────────────────────────────────────
# Render injects these environment variables automatically when you link
# a PostgreSQL database to the web service via render.yaml.
#
# Set these manually in Render dashboard → your service → Environment:
#   APP_JWT_SECRET  → a 64-char random string (auto-generated via render.yaml)
#   APP_URL         → your Render public URL, e.g. https://qr-origin-tracker.onrender.com
# ─────────────────────────────────────────────────────────────────────────────

server.port=${PORT:8080}

# Use individual PG* vars injected by Render's PostgreSQL plugin.
# SSL is required on Render's managed Postgres.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.jwt.secret=${APP_JWT_SECRET:change-this-in-render-dashboard-use-64-chars}
app.jwt.expiration-ms=86400000

app.upload-dir=/tmp/uploads

app.frontend-base-url=${APP_URL:https://qr-origin-tracker.onrender.com}
app.cors.allowed-origins=${APP_URL:https://qr-origin-tracker.onrender.com}
