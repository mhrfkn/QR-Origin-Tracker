spring.application.name=origin-tracker

server.port=8080
server.address=0.0.0.0

spring.datasource.url=jdbc:postgresql://localhost:5432/origindb
spring.datasource.username=origin
spring.datasource.password=origin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.frontend-base-url=http://localhost:4200

# SECURITY: In production, override via environment variable:
#   JAVA_OPTS="-Dapp.jwt.secret=<your-256-bit-random-secret>"
# Minimum 32 chars; use at least 64 chars of high-entropy random data in production.
app.jwt.secret=change-this-origin-tracker-demo-secret-key-32b
app.jwt.expiration-ms=86400000
app.upload-dir=${user.dir}/uploads

# CORS: Comma-separated list of allowed origins.
# PRODUCTION: Replace with your exact frontend domain, e.g. https://yourdomain.com
app.cors.allowed-origins=http://localhost:4200
