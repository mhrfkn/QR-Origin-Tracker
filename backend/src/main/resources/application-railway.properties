# ── Railway production profile ────────────────────────────────────────────────
# All sensitive values come from Railway environment variables.
# Set these in the Railway dashboard → your service → Variables:
#
#   DATABASE_URL   → auto-set by Railway PostgreSQL plugin (jdbc: form)
#   APP_JWT_SECRET → a long random string (64+ chars)
#   APP_URL        → your Railway public URL, e.g. https://qr-origin-tracker.up.railway.app
#   PORT           → auto-set by Railway (do not override)
# ─────────────────────────────────────────────────────────────────────────────

server.port=${PORT:8080}

# Railway PostgreSQL plugin sets DATABASE_URL in the form:
#   postgresql://user:pass@host:port/dbname
# Spring needs jdbc: prefix — Railway also exposes JDBC_DATABASE_URL which is ready to use.
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT — override in Railway dashboard with a strong secret
app.jwt.secret=${APP_JWT_SECRET:change-this-in-railway-dashboard-use-64-chars}
app.jwt.expiration-ms=86400000

# Upload directory — Railway has ephemeral storage; uploads reset on redeploy.
# For permanent file storage, integrate a service like Cloudflare R2 or AWS S3.
app.upload-dir=/tmp/uploads

# The public URL of this Railway service (used to build QR code tracking URLs).
# Set APP_URL in Railway dashboard to your service's public domain.
app.frontend-base-url=${APP_URL:https://your-app.up.railway.app}

# Same origin — frontend and backend are served from the same Railway URL,
# so no CORS is needed. We still set it to the same origin for safety.
app.cors.allowed-origins=${APP_URL:https://your-app.up.railway.app}
