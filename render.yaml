services:
  # ── Web Service (Spring Boot + Angular bundled) ───────────────────────────
  - type: web
    name: qr-origin-tracker
    runtime: java
    plan: free
    buildCommand: cd backend && ./mvnw -B package -DskipTests
    startCommand: java -jar backend/target/origin-tracker-0.0.1-SNAPSHOT.jar --spring.profiles.active=render
    healthCheckPath: /api/public/health
    envVars:
      - key: APP_JWT_SECRET
        generateValue: true          # Render generates a random secret automatically
      - key: APP_URL
        value: https://qr-origin-tracker.onrender.com   # update after first deploy
      - key: DATABASE_URL
        fromDatabase:
          name: qr-origin-tracker-db
          property: connectionString
      - key: PGUSER
        fromDatabase:
          name: qr-origin-tracker-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: qr-origin-tracker-db
          property: password

  # ── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: qr-origin-tracker-db
    plan: free
    databaseName: origindb
    user: origin
