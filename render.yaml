services:
  # ── Web Service (Spring Boot + Angular via Docker) ────────────────────────
  - type: web
    name: qr-origin-tracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/public/health
    envVars:
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://qr-origin-tracker.onrender.com   # update after first deploy
      - key: PGHOST
        fromDatabase:
          name: qr-origin-tracker-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: qr-origin-tracker-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: qr-origin-tracker-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: qr-origin-tracker-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: qr-origin-tracker-db
          property: password

# ── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: qr-origin-tracker-db
    plan: free
    databaseName: origindb
    user: origin
